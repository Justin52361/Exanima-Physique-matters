; Exanima - Build Matters : settings
;
; After editing this file, run apply.bat again (or:  python -m build_patch apply).
; The values are written into Exanima.exe, so the game does not read this file itself.
;
; All numbers are MULTIPLIERS: 1.0 = no change, 1.5 = +50%, 0.5 = -50%.
;
; The Physique box on the character-creation screen has four archetypes, one at the middle of
; each edge. The exact centre of the box is "normal" (always x1.0). Everything in between blends
; smoothly, and the corners are an even mix of the two neighbouring edges:
;
;                      TOP: muscular
;                           |
;       LEFT: skinny ---- centre ---- RIGHT: fat
;                           |
;                  BOTTOM: muscular lean

[build]
; --- TOP: muscular ---------------------------------------------------------
muscular_damage = 2

; --- BOTTOM: muscular lean --------------------------------------------------
muscular_lean_damage = 1.5
muscular_lean_attack_speed = 1.5

; --- LEFT: skinny, not muscular ---------------------------------------------
skinny_attack_speed = 2

; --- RIGHT: fat -------------------------------------------------------------
; Implemented as "damage you take is divided by this", i.e. a bigger health pool against hits.
fat_health = 2

; attack_speed makes the attack animations (wind-up and swing) play faster. Walking and the
; recovery stance after a swing are not affected. Swings are physically simulated, so a faster
; swing can also land with more force.

[options]
; player    = only your own character is affected (default)
; everyone  = every character in the game uses the same rules, according to its own build
apply_to = player

; Leave empty to auto-detect the Steam install. Otherwise the full path to Exanima.exe.
game_exe =
